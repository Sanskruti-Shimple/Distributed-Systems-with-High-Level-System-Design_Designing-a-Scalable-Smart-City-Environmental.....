{{- range $name := list "producer" "consumer" }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eventhub-{{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  provider: azure
  secretObjects:
    - secretName: eventhub-{{ $name }}
      type: Opaque
      data:
        - objectName: connection-string
          key: connection-string
  parameters:
    usePodIdentity: "false"
    clientID: {{ $.Values.keyVault.workloadIdentityClientId | quote }}
    keyvaultName: {{ $.Values.keyVault.name | quote }}
    tenantId: {{ $.Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: eventhub-{{ $name }}-connection
          objectAlias: connection-string
          objectType: secret
          objectVersion: ""
{{- end }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: device-token
  namespace: {{ .Values.namespace }}
spec:
  provider: azure
  secretObjects:
    - secretName: device-token
      type: Opaque
      data:
        - objectName: device-token
          key: device-token
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.keyVault.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: device-ingestion-token
          objectAlias: device-token
          objectType: secret
          objectVersion: ""