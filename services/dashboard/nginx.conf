server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8001/api/;
        proxy_set_header Host $host;
    }

    location /health/ {
        proxy_pass http://api:8001/health/;
        proxy_set_header Host $host;
    }

    location /ingestion/ {
        proxy_pass http://ingestion:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}