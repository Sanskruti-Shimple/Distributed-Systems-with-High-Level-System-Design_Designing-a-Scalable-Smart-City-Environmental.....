name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest fastapi httpx pydantic confluent-kafka
      - run: python -m pip install -e services/shared/python
      - name: Test ingestion
        working-directory: services/iot-ingestion
        run: python -m pytest -q tests
        env:
          PYTHONPATH: ${{ github.workspace }}/services/shared/python
      - name: Test processor
        working-directory: services/stream-processor
        run: python -m pytest -q tests
        env:
          PYTHONPATH: ${{ github.workspace }}/services/shared/python
      - name: Test API
        working-directory: services/rest-api
        run: python -m pytest -q tests
        env:
          PYTHONPATH: ${{ github.workspace }}/services/shared/python

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/smart-city
